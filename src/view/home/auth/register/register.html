<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCare | Create Account</title>
    <link rel="stylesheet" href="/src/view/home/auth/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass">
            <h2>Join GlowCare</h2>
            <p>Start your radiant journey today</p>
            
            <form>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Repeat password" required>
                </div>
                
                <div class="options">
                    <label style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" required> I agree to terms
                    </label>
                </div>
                
                <button type="submit" class="btn-login">Create Account</button>
            </form>
            
            <p class="footer-text">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>
</body>
</html>
